/**
 * Top-level build file for ftc_app project.
 *
 * It is extraordinarily rare that you will ever need to edit this file.
 */

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Note for FTC Teams: Do not modify this yourself.
        // Optimized: Using a stable AGP version.
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

// Optimized: Consolidated repositories here to avoid redundant lookups.
allprojects {
    repositories {
        google()
        mavenCentral()
        // Repository for FTCLib and other FTC-related dependencies
        maven { url = 'https://maven.brott.dev/' }
    }
}
